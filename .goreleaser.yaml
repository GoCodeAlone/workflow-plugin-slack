version: 2

before:
  hooks:
    - "sh -c 'rm -rf .goreleaser-tmp && mkdir -p .goreleaser-tmp && cp plugin.json .goreleaser-tmp/plugin.json'"
    - "sh -c 'sed -i.bak \"s/\\\"version\\\": \\\".*\\\"/\\\"version\\\": \\\"{{ .Version }}\\\"/\" .goreleaser-tmp/plugin.json && rm -f .goreleaser-tmp/plugin.json.bak'"
    - "sh -c 'sed -i.bak \"s|/download/v[^/]*/|/download/v{{ .Version }}/|g\" .goreleaser-tmp/plugin.json && rm -f .goreleaser-tmp/plugin.json.bak'"

builds:
  - main: ./cmd/{{ .ProjectName }}
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/GoCodeAlone/workflow-plugin-slack/internal.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - src: .goreleaser-tmp/plugin.json
        dst: plugin.json
      - plugin.contracts.json

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  draft: true
